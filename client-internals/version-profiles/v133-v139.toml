# Graal client profiles, 1.33 to 1.39 (gen 2).
# Cleaned observations: static reads of the shipped clients, release notes, shipped assets.
# No addresses, function names or decompiler output. See versions-133-139.md for the method.
# Every [[version]] lists the full value for each key, not a diff, so a reader can load one entry alone.

schema = 1
range = "1.33-1.39"

[confidence]
token = "confirmed"
generation = "confirmed"
compression = "confirmed"
cipher = "confirmed"
login_key_byte = "confirmed"
client_type = "confirmed"
listserver = "confirmed"
default_server = "confirmed"
login = "confirmed in 1.33 and 1.39; same code shape assumed for 1.34-1.38"
pli_sent = "confirmed for ids passed as constants; a few send sites pass the id in a register and are not counted"
plo_known = "confirmed"
plprops_known = "confirmed from 1.34; 1.33 split between player and NPC switch inferred"
otherplprops_known = "confirmed set; role (props of other players) inferred"
npcprops_known = "as plprops_known"
baddyprops_known = "confirmed"
udp_known = "confirmed (receive side)"
level_formats = "confirmed"
save_format = "confirmed (string references; writer traced in 1.21 and 1.32)"
file_wantfile = "confirmed (id 23 sent)"
file_updatefile = "confirmed (id 34 never sent)"
file_modtime = "inferred from server source (pre-2.1 PLO_FILE form)"
file_large = "confirmed (ids 68/69/84 not handled)"
tampercheck = "confirmed (id 39 not sent)"
gs1_commands = "confirmed (table contents; whether each has an executor case is not checked)"
config_keys = "confirmed for plain strings; 1.38+ builds some strings char by char, so keys may be missing from those lists"
languages = "confirmed (shipped language files)"
assets = "confirmed (shipped files)"

# Feature flags: first build that has each one. Each [[version]].features table repeats the on/off value.
[features]
player_list_sections = { since = "1.33", confidence = "confirmed", note = "F7 list split into GPs, Guild, Normal, Ignore" }
pm_history_memory = { since = "1.33", confidence = "confirmed", note = "History button, last 50 messages, not saved" }
png_palette_images = { since = "1.33", confidence = "confirmed", note = "16/256-colour PNG only, no alpha, no interlace" }
udp_peer_data = { since = "1.33", confidence = "confirmed", note = "noudp= and fixedudpport= (14899) options" }
multiplayer_local_2_4 = { since = "1.33", confidence = "confirmed", note = "start modes: One Player, One Player Online, Two, Three, Four Players" }
script_debugger_f6 = { since = "1.34", confidence = "confirmed", note = "working debugger with breakpoints; offline only" }
png_screenshots = { since = "1.34", confidence = "confirmed", note = "Alt+2 writes 24-bit PNG" }
mng_images = { since = "1.34", confidence = "confirmed", note = "MNG loader appears; \"better support\" in 1.38" }
sfx_limits = { since = "1.34", confidence = "confirmed", note = "one sound per type per frame, at most 8 at once" }
horse_loses_bush_when_hit = { since = "1.34", confidence = "confirmed", note = "rider pushed off at 0 bushes" }
two_riders_offline = { since = "1.34", confidence = "confirmed", note = "offline only, horse needs 5 bushes" }
ignored_accounts_file = { since = "1.34", confidence = "confirmed", note = "ignoredaccounts.txt; ignoring player shown red" }
local_focus_chat_2_4 = { since = "1.34", confidence = "confirmed", note = "click a player view to focus; CHAT label on HUD (asset from 1.35)" }
buddy_list = { since = "1.35", confidence = "confirmed", note = "player list popup Buddy; buddyaccounts.txt" }
html_pms = { since = "1.35", confidence = "confirmed", note = "TWebBrowser PMs; nohtmlinpms= option; loaded dynamically from 1.36" }
editor_generate_map = { since = "1.35", confidence = "inferred", note = "editor menu \"Generate map\" writing graalmap.bmp" }
senior_gp_tag = { since = "1.35", confidence = "inferred", note = "player list tag \"(Senior GP)\"; \"(RC)\" tag from 1.36" }
nickname_length_limit = { since = "1.36", confidence = "confirmed", note = "limitnicknames= / nicknamelimit= (default 50)" }
level_object_arrays = { since = "1.36", confidence = "confirmed", note = "GS1 bombs[], arrows[], items[], explos[], horses[] (read only)" }
server_cap_28000 = { since = "1.36", confidence = "confirmed", note = "server side, from the release notes; no client-side change found" }
distance_scaled_sfx = { since = "1.37", confidence = "confirmed", note = "sound volume depends on distance" }
showimg_normal_npcs = { since = "1.37", confidence = "confirmed", note = "only the current player sees it" }
looped_sounds = { since = "1.37", confidence = "confirmed", note = "playlooped / stopsound" }
array_literals = { since = "1.37", confidence = "confirmed", note = "myarr = {..}; built-in true/false; hasweapon()" }
account_owner_star_nick = { since = "1.38", confidence = "confirmed", note = "server marks nick == account as *nick" }
server_item_pickup = { since = "1.38", confidence = "confirmed", note = "PLI_ITEMTAKE (32): server grants rupees (anti-dupe)" }
emotion_icons = { since = "1.38", confidence = "confirmed", note = "Ctrl+A/B/D/E/F/G/H/L/M/O/P/R/S/T/W/X/Z; 1.39 adds C/K/Y" }
pms_saved_to_disk = { since = "1.38", confidence = "confirmed", note = "pms/messages_<account>.txt" }
configurable_keys = { since = "1.38", confidence = "confirmed", note = "graalconfig keys up/down/left/right/item/attack/action/map/switchtochat/itemlist/pause, 3 keys each" }
zoom_alt8_alt9 = { since = "1.38", confidence = "confirmed", note = "readme key list" }
npcs_array_rw = { since = "1.38", confidence = "confirmed", note = "npcs[index].attr read/write; testbomb() etc." }
shield_down_visible = { since = "1.38", confidence = "confirmed", note = "other players see a laid-down shield" }
editor_show_blocking = { since = "1.38", confidence = "confirmed", note = "editor checkbox \"Show blocking tiles\"" }
external_chat_removed = { since = "1.38", confidence = "confirmed", note = "externalchat= option and in/outmessages.txt gone from 1.38" }
profiles = { since = "1.39", confidence = "confirmed", note = "profile window: real name, age, sex, country, ICQ, e-mail, homepage, hangout, quote; ids 80/81 and 75" }
player_list_options = { since = "1.39", confidence = "confirmed", note = "separate window: ignore mass PMs, no HTML, no images, sort by nickname" }
ignore_toalls = { since = "1.39", confidence = "confirmed", note = "notoalls=" }
dont_load_list_heads = { since = "1.39", confidence = "confirmed", note = "dontloadlistheads=" }
dont_connect_levels = { since = "1.39", confidence = "confirmed", note = "dontconnectlevels=" }
chat_history_up_down = { since = "1.39", confidence = "confirmed", note = "last 100 chat lines" }
dead_players_nonblocking = { since = "1.39", confidence = "confirmed", note = "release note; other players with 0 hearts can be walked through" }
weapon_list_mouse = { since = "1.39", confidence = "confirmed", note = "click to select; drawn with the sign renderer" }
editor_tile_drawing = { since = "1.39", confidence = "confirmed", note = "drag-paint single tiles; drop images to create NPCs" }
new_head_handling = { since = "1.39", confidence = "confirmed", note = "heads loaded differently; account name (prop 34) parsed for self" }

