# Graal client profiles, 1st Graal (Sept 1998) to 1.1 (Feb 1999) (gen 1, text relay).
# Cleaned observations: static reads of the shipped clients, readmes, shipped assets.
# No addresses, function names or decompiler output. Protocol: ../../protocol/relay-1998.md.
# Every [[version]] lists the full value for each key, not a diff.
# These builds have no login, token or account. Keys that only make sense for gen 2+ are left out;
# relay_game and d_types_sent take the place of token and pli_sent.

schema = 1
range = "1stgraal-1.1"

[confidence]
generation = "confirmed"
transport = "confirmed"
default_server = "confirmed (compiled-in)"
dialog_server = "confirmed (connect dialog DFM / strings)"
relay_game = "confirmed (constant passed with N; on a level the client sends G<n> + level location instead)"
d_types_sent = "confirmed (constant type letters at the D send sites)"
level_formats = "confirmed (loader magics)"
save_format = "confirmed (writer)"
config_keys = "confirmed (plain strings)"

[features]
local_two_player = { since = "1st Graal", confidence = "confirmed", note = "two client objects for a split local game" }
graal_level_loader = { since = "2nd Graal", confidence = "confirmed", note = "GR-V1.00/1.01" }
connect_dialog_14802 = { since = "3rd Graal", confidence = "confirmed", note = "second port field pre-filled with the relay server" }
raw_winsock = { since = "3rd Graal", confidence = "confirmed", note = "ICS TWSocket before this" }
directsound = { since = "4th Graal alpha", confidence = "confirmed", note = "" }
five_colours = { since = "4th Graal alpha", confidence = "confirmed", note = "S message and save carry 5 colours, not 4" }
guild_code_file = { since = "5th Graal", confidence = "confirmed", note = "guildname.code, DES-wrapped" }
web_levels = { since = "6th Graal (beta5)", confidence = "confirmed", note = "levels over HTTP from the relay operator" }
config_file = { since = "6th Graal (beta5)", confidence = "confirmed", note = "graalconfig.txt keys" }
horse = { since = "7th Graal (beta7)", confidence = "confirmed", note = "D type 0, TAdventureHorse" }
carry_npc = { since = "9th Graal alpha", confidence = "confirmed", note = "save records carry NPCs" }
sit_sleep_poses = { since = "9th Graal (beta9)", confidence = "inferred", note = "D types 6/7; readme dates sitting and sleeping to 13th" }
four_player_local = { since = "14th Graal (1.1)", confidence = "confirmed", note = "save header modes 3/4" }
gsave_wrapped = { since = "15th Graal (1.1)", confidence = "confirmed", note = ".gsave, two DES copies" }
registration_key = { since = "15th Graal (1.1)", confidence = "confirmed", note = "reg.code; relay type 8 duplicate check" }
ip_cache = { since = "15th Graal (1.1)", confidence = "confirmed", note = "TAdventureServer host-to-IP record" }
server_level_choice = { since = "15th Graal (1.1)", confidence = "confirmed", note = "NR/NL reply; onlinestartlocal.graal. Captured from the 1.1.9 server: NR then NL with local levels, NR alone with Cyberjoueur levels" }
graalonline_home = { since = "1.1.9 Gold Edition", confidence = "confirmed", note = "dialog host and web levels move to <list-host-classic>" }

