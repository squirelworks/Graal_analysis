# Graal client profiles, 1.21 to 1.32 (gen 2, GSERV tokens).
# Cleaned observations: static reads of the shipped clients, release notes, shipped assets.
# No addresses, function names or decompiler output. Method: see README.md ("1.21 to 1.32").
# Every [[version]] lists the full value for each key, not a diff, so a reader can load one entry alone.
# Same keys as v133-v139.toml, plus plprops_sent and bundled_servers.

schema = 1
range = "1.21-1.32"

[confidence]
token = "confirmed"
generation = "confirmed"
compression = "confirmed"
cipher = "confirmed"
login_key_byte = "confirmed"
client_type = "confirmed (player ' '; RemoteControl '!')"
listserver = "confirmed (none: the client dials one game server)"
default_server = "confirmed"
login = "confirmed in 1.21 and 1.32; same code shape in the builds between"
pli_sent = "lower bound: only ids passed as constants to the send method; some send sites pass the id in a register (1.28 beta 2 and 1.3 test show fewer constants than 1.21 for that reason)"
plo_known = "confirmed (receive switch)"
plprops_known = "confirmed (player prop parser switch)"
plprops_sent = "confirmed (player prop writer switch)"
npcprops_known = "confirmed (NPC prop parser switch)"
baddyprops_known = "confirmed"
udp_known = "confirmed (receive side; ids as sent, without the +32)"
level_formats = "confirmed (loader magics)"
save_format = "confirmed (writer and reader)"
file_wantfile = "not checked"
tampercheck = "confirmed (no id 39)"
gs1_commands = "confirmed (command name table; whether each has an executor case is not checked)"
config_keys = "confirmed (plain strings)"
languages = "confirmed (shipped language files)"
# features: confirmed = seen in the binary; doc = release notes only

# Feature flags: first build that has each one. Each [[version]].features table repeats the on/off value.
[features]
packet_compression = { since = "1.21", confidence = "confirmed", note = "zlib 1.0.4 on every flush; \"packet compression\" in the 1.2 notes" }
accounts_login = { since = "1.21", confidence = "confirmed", note = "account and password at login; connect dialog defaults guest / guest" }
npc_weapons = { since = "1.21", confidence = "confirmed", note = "weapon list (Q); weapon names saved in Graalsv11" }
credentials_in_config = { since = "1.21", confidence = "confirmed", note = "accountname= and password= read from graalconfig.txt; gone from 1.3 test" }
language_files = { since = "1.28 beta 2", confidence = "confirmed", note = "language= option; languageEnglish/Deutsch.txt shipped" }
nodecompressionerror_option = { since = "1.28 beta 2", confidence = "confirmed", note = "hides the inflate error message" }
udp_peer_data = { since = "1.28 beta 2", confidence = "confirmed", note = "\"direct data packages\": positions, sprites, arrows and bombs sent straight to players in the same room" }
alignment_points = { since = "1.3 test", confidence = "doc", note = "AP 0-100, start 50, name colour by AP; replaces PK flags" }
weblevel_cache = { since = "1.3 test", confidence = "confirmed", note = "levels saved to weblevels/ with a timestamp; the server only resends changed levels" }
level_snapshot_alt5 = { since = "1.3 test", confidence = "doc", note = "Alt+5 writes a playable snapshot level" }
record_movement_alt6_alt7 = { since = "1.3 test", confidence = "doc", note = "writes levels/recordpos.txt" }
credentials_in_registry = { since = "1.3 test", confidence = "doc", note = "account and password saved encrypted in the registry" }
pm_ignore_button = { since = "1.3 test", confidence = "doc", note = "ignore button in the PM window; ignores survive a restart (by IP)" }
font_options = { since = "1.3 test", confidence = "confirmed", note = "font= and fontsize=" }
account_message_code = { since = "1.3 test", confidence = "doc", note = "#a = account name" }
setgifpart = { since = "1.3 test", confidence = "confirmed", note = "GS1 command" }
delete_npc_weapons = { since = "1.3 test", confidence = "doc", note = "Q window, Delete" }
default_port_14900 = { since = "1.31", confidence = "confirmed", note = "14804 before" }
udp_options = { since = "1.31", confidence = "confirmed", note = "noudp= and fixedudpport= (14899); fixedport=" }
adjacent_levels_visible = { since = "1.31", confidence = "doc", note = "outside levels drawn as one big level, with NPCs and players from nearby levels" }
showap = { since = "1.31", confidence = "doc", note = "type showap to see your alignment" }
ignore_mass_messages = { since = "1.32", confidence = "confirmed", note = "nomassmessages=" }
doubleclick_fullscreen = { since = "1.32", confidence = "doc", note = "" }
sign_scrollback = { since = "1.32", confidence = "doc", note = "up arrow scrolls back in signs" }
message_of_the_day = { since = "1.32", confidence = "doc", note = "sent by the server at login" }
drop_script_onto_editor = { since = "1.32", confidence = "doc", note = "dropping a text file creates an NPC" }
walk_through_unpaused_players_nopk = { since = "1.32", confidence = "doc", note = "in no-playerkilling levels" }

