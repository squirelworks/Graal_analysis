# Per-version client profiles, 1.41 rev1 to 2.17
#
# One table per release. `base` names the profile this one inherits from: a reader
# copies the base, then applies the keys given here. Lists replace the base list
# unless the key ends in `_add` / `_remove`, which edit the inherited list.
#
# Each key carries one of these tags in `src` (key -> tag), or the profile-wide
# default in `src_default`:
#   bin = read from the client binary (switch tables, send sites, forms, strings)
#   doc = the release notes shipped with the client (newfeatures*.txt)
#   srv = GServer-v2 / gs2lib source (what a server does for this version)
#   inf = inferred from neighbours; not checked in a binary of this version
#
# Ids are protocol ids (wire byte - 32). Names follow gs2lib (see protocol/packet-ids.md).
# Nothing here comes from decompiler output; builds are identified by MD5 in
# client-internals/build-catalogue.md.

schema = 1

[defaults]
client_type = 0                 # first GCHAR of the login line
generation = 3                  # zlib + one-byte LCG insertion (protocol/codec-and-framing.md)
login_key_byte = true           # GCHAR key (rand & 0x7F) after the client type
compression = "zlib"
cipher = "gen3"
login_layout = ["c type", "c key", "8 token", "str account", "str password"]
udp = true

