name: release

# Drafts a GitHub release for a book version whose PDFs are already in the tree:
# release/0.0.1/ for 0.0.1, book/<version>/ from 0.0.2 on. Run it by hand
# (Actions, release, Run workflow) with the version and, optionally, the commit
# the tag should point at. Nothing is tagged until the owner presses Publish on
# the draft (AGENTS.md: no tag or release without the owner's go-ahead).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Book version, without the v (e.g. 0.0.2)'
        required: true
      target:
        description: 'Commit the tag should point at (empty = the commit this run is on)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad version $VERSION"; exit 1; }
          TAG="v$VERSION"
          SHA=$(git rev-parse --verify "${TARGET:-$GITHUB_SHA}^{commit}")
          git checkout -q "$SHA"
          if [ -d "release/$VERSION" ]; then DIR="release/$VERSION"; else DIR="book/$VERSION"; fi
          ls "$DIR"/*.pdf > /dev/null || { echo "::error::no PDFs in $DIR at $SHA"; exit 1; }
          mkdir dist
          cp "$DIR"/*.pdf dist/
          tar czf "dist/graal-analysis-$VERSION-pdfs.tar.gz" -C "$DIR" .
          NOTES="Graal Analysis $VERSION. The PDFs are attached one by one and as one archive. Contents and page counts: $DIR/README.md. Notes viewer: python3 tools/navigator/navigator.py (loopback port 8765)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true ]; then
              gh release upload "$TAG" dist/* --clobber
            else
              echo "$TAG is already published; leaving it as it is."
            fi
          else
            gh release create "$TAG" dist/* --draft --target "$SHA" --title "Graal Analysis $VERSION" --notes "$NOTES"
          fi
          echo "Draft: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
