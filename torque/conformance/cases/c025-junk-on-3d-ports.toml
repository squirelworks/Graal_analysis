red_drawn = "?"
alive = true
source = "[srv] seihai-gserver src/graal3d/service.rs (Service::datagram: data packets from an address with no session are dropped, unknown kinds ignored); the client side is open (T3D-142); the junk comes from the server VM's own address, not the client's, so the client's link should not see it"

