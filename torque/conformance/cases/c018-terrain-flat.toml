id = "C018"
slug = "terrain-flat"
title = "A flat streamed terrain with one texture: chunks streamed, textures fetched, ground drawn"
rows = ["T3D-040", "T3D-044", "T3D-117"]
priority = 1

[world]
lines = """
sun 0.57735 0.57735 -0.57735 0.8 0.8 0.8 1 0.3 0.3 0.35 1
sky conf_sky0,conf_sky1,conf_sky2,conf_sky3,conf_sky4,conf_sky5 500
skyoptions 1 0 0 0.4 0.6 0.9
terrain conf_ter 8
playershape conf_nomat.3ds
spawn 0 0 1
"""
files = ["conf_nomat.3ds", "conf_sky*", "heights.info", "conf_ground.png"]
terrain = ["conf_ter"]

[server]
options = ["graal3d_pushterrain = true"]

[run]
seconds = 70

[[check]]
id = "terrain_request"
kind = "trace"
pattern = "TerrainRequestUpdatesEvent"
note = "the client had the TerrainBlock and sent the stamps of the chunks it holds"

[[check]]
id = "asks_info"
kind = "server"
pattern = "file heights\\.info: "

[[check]]
id = "ground_textured"
kind = "pixel"
colour = [200, 160, 90]
tol = 60
min_fraction = 0.05

[[check]]
id = "ground_white"
kind = "pixel"
colour = [255, 255, 255]
tol = 30
min_fraction = 0.05

[[check]]
id = "alive"
kind = "alive"

[expect."3.153"]
terrain_request = false
asks_info = false
ground_textured = false
alive = true
source = "[srv] seihai-gserver docs/GRAAL3D.md: terrain, water and ground cover go to protocols 21 and 24 only"

[expect."4.04r2"]
terrain_request = false
asks_info = false
ground_textured = false
alive = true
source = "[srv] terrain goes to protocols 21 and 24 only"

[expect."4.20r8"]
terrain_request = true
asks_info = false
ground_textured = false
ground_white = true
alive = true
source = "[lab] T3D-117 (torque/multi-client-3d-lab-2026-11-25.md: 4.20r8 takes all 256 chunks, never asks for heights.info or a texture, draws a white ground, no crash on Mesa; it crashed near the terrain on GDI Generic GL, T3D-079)"

[expect."5.12"]
terrain_request = true
asks_info = "?"
ground_textured = true
ground_white = false
alive = true
source = "[lab] T3D-040, T3D-044 (torque/terrain-512.md; with graal3d_pushterrain the first visit is textured: seihai-gserver docs/GRAAL3D.md lab 2026-11-26)"
