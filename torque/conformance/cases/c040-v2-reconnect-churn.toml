id = "C040"
slug = "v2-reconnect-churn"
title = "seihai-gserver-v2: five visits in a row on one server run each get a 3D link and the last still draws"
rows = ["T3D-145"]
priority = 2

[world]
lines = """
sun 0.57735 0.57735 -0.57735 0.8 0.8 0.8 1 0.3 0.3 0.35 1
sky conf_sky0,conf_sky1,conf_sky2,conf_sky3,conf_sky4,conf_sky5 500
skyoptions 1 0 0 0.4 0.6 0.9
playershape conf_nomat.3ds
spawn 0 0 1
object ConfCube conf_red.3ds 0 4 1
"""
files = ["conf_red.3ds", "conf_nomat.3ds", "conf_sky*"]

[server]
kind = "v2"

[run]
seconds = 30
sessions = 5

[[check]]
id = "five_links"
kind = "server"
pattern = "Graal3D: \\S+ linked from"
count = 5
note = "a 3D link logged for each visit"

[[check]]
id = "graal3d_on"
kind = "server"
pattern = "Graal3D: tracing every 3D client"
note = "gs2emu started with the case options (graal3d and its trace)"

[[check]]
id = "red_drawn"
kind = "pixel"
colour = [220, 0, 0]
tol = 70
min_fraction = 0.002
note = "the session still draws the cube after the injection (the last screenshot is taken after it)"

[[check]]
id = "alive"
kind = "alive"

[expect."3.153"]
five_links = true
graal3d_on = true
red_drawn = false
alive = "?"
source = "[lab] seihai-gserver-v2 bin/docs/graal3d.md, Hostile and broken clients: the 2026-11-26 run with two real 5.12 clients linked (60 link-and-drop cycles on one account: the session count never grew); [srv] T3D-106: protocol 19 gets no GameObjects, only Sky and the TGE Player/Camera"

[expect."4.04r2"]
five_links = true
graal3d_on = true
red_drawn = false
alive = "?"
source = "[lab] seihai-gserver-v2 bin/docs/graal3d.md, Hostile and broken clients: the 2026-11-26 run with two real 5.12 clients linked; [srv] T3D-106: protocol 19 gets no GameObjects, only Sky and the TGE Player/Camera"

[expect."4.20r8"]
five_links = "?"
graal3d_on = true
red_drawn = "?"
alive = "?"
source = "[lab] seihai-gserver-v2 bin/docs/graal3d.md, Hostile and broken clients: the 2026-11-26 run with two real 5.12 clients linked; unread for 4.20r8 on v2"

[expect."5.12"]
five_links = true
graal3d_on = true
red_drawn = true
alive = true
source = "[lab] seihai-gserver-v2 bin/docs/graal3d.md, Hostile and broken clients: the 2026-11-26 run with two real 5.12 clients linked: the walking client stayed connected and kept drawing"

[expect."6.037"]
five_links = false
graal3d_on = true
red_drawn = false
alive = true
source = "T3D-121 (2D-only Quattro build, no 3D link)"

[expect."6.037F"]
five_links = "?"
graal3d_on = true
red_drawn = "?"
alive = "?"
source = "unread: first live run of our Frankenstein build (T3D-152)"
note = "the Frankenstein 6.037 client (gcr), its own column; 6.037 is the retail 2D-only 6.03r7"
