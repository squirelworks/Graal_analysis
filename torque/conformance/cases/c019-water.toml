id = "C019"
slug = "water"
title = "A WaterBlock under the spawn: its surface texture is fetched and the client stays up"
rows = ["T3D-045"]
priority = 2

[world]
lines = """
sun 0.57735 0.57735 -0.57735 0.8 0.8 0.8 1 0.3 0.3 0.35 1
sky conf_sky0,conf_sky1,conf_sky2,conf_sky3,conf_sky4,conf_sky5 500
skyoptions 1 0 0 0.4 0.6 0.9
water -1024 -1024 -19.5 2048 2048 20 conf_water 0
playershape conf_nomat.3ds
spawn 0 0 1
"""
files = ["conf_nomat.3ds", "conf_sky*", "conf_water.png"]

[run]
seconds = 60

[[check]]
id = "asks_water"
kind = "server"
pattern = "file conf_water(\\.png)?: "

[[check]]
id = "water_drawn"
kind = "pixel"
colour = [20, 40, 160]
tol = 60
min_fraction = 0.05

[[check]]
id = "alive"
kind = "alive"

[expect."3.153"]
asks_water = false
water_drawn = false
alive = true
source = "[srv] water goes to protocols 21 and 24 only"

[expect."4.04r2"]
asks_water = false
water_drawn = false
alive = true
source = "[srv] water goes to protocols 21 and 24 only"

[expect."4.20r8"]
asks_water = "?"
water_drawn = "?"
alive = true
source = "[lab] seihai-gserver docs/GRAAL3D.md lab 2026-11-26 (4.20r8 under Wine: water drawn); texture naming unread"

[expect."5.12"]
asks_water = "?"
water_drawn = "?"
alive = true
source = "[lab] T3D-045 predates the WaterBlock writer; the surface draw on 5.12 is unread (records it)"

[expect."6.037F"]
asks_water = "?"
water_drawn = "?"
alive = "?"
source = "unread: first live run of our Frankenstein build (T3D-152)"
note = "the Frankenstein 6.037 client (gcr), its own column; 6.037 is the retail 2D-only 6.03r7"
