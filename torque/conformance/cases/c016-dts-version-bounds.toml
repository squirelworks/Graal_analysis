id = "C016"
slug = "dts-version-bounds"
title = "A .dts with version 16 or 25 is refused with a console error; version 24 loads"
rows = ["T3D-029", "T3D-038"]
priority = 2
needs = ["mbg"]

[world]
lines = """
sun 0.57735 0.57735 -0.57735 0.8 0.8 0.8 1 0.3 0.3 0.35 1
sky conf_sky0,conf_sky1,conf_sky2,conf_sky3,conf_sky4,conf_sky5 500
skyoptions 1 0 0 0.4 0.6 0.9
object ConfDts24 conf_v24.dts 2 4 1
object ConfDts16 conf_v16.dts -2 4 1
object ConfDts25 conf_v25.dts 0 6 1
playershape conf_nomat.3ds
spawn 0 0 1
"""
files = ["conf_nomat.3ds", "conf_sky*"]
# copies of one held version-24 .dts with the version word set (gen_content.set_version);
# never version 17, which froze the Linux 4.20 (torque/lab-2026-11-25-g3d-worlds.md)
derive = [
  { pack = "mbg", pick = "*.dts", out = "conf_v24.dts", version = 24 },
  { pack = "mbg", pick = "*.dts", out = "conf_v16.dts", version = 16 },
  { pack = "mbg", pick = "*.dts", out = "conf_v25.dts", version = 25 },
]

[run]
seconds = 60

[[check]]
id = "asks_v24"
kind = "server"
pattern = "file conf_v24\\.dts: "

[[check]]
id = "refuses_16"
kind = "console"
pattern = "not supported anymore"

[[check]]
id = "refuses_25"
kind = "console"
pattern = "only version 24 and before"

[[check]]
id = "alive"
kind = "alive"

[expect."3.153"]
asks_v24 = false
refuses_16 = false
refuses_25 = false
alive = true
source = "[srv] T3D-106: protocol 19 gets no GameObjects, so the shapes are never named to it"

[expect."4.04r2"]
asks_v24 = false
refuses_16 = false
refuses_25 = false
alive = true
source = "[srv] T3D-106: protocol 19 gets no GameObjects, so the shapes are never named to it"

[expect."4.20r8"]
asks_v24 = true
refuses_16 = "?"
refuses_25 = "?"
alive = "?"
source = "[static] the dts gate is in the shared protocol 24 engine (T3D-002, torque/3d-loader-validation-by-build-2026-11-26.md); not run on 4.20r8"

[expect."5.12"]
asks_v24 = true
refuses_16 = true
refuses_25 = true
alive = true
source = "[lab] T3D-029 (torque/live-512-shapes-2026-11-25.md: 16 'not supported anymore', 25 'only version 24 and before', the client stays up)"

[expect."4.20r6L"]
asks_v24 = true
refuses_16 = true
refuses_25 = true
alive = true
source = "[lab] torque/lab-2026-11-25-g3d-worlds.md (Linux 4.20: the same two console errors, the client stays up)"

[expect."6.037F"]
asks_v24 = "?"
refuses_16 = "?"
refuses_25 = "?"
alive = "?"
source = "unread: first live run of our Frankenstein build (T3D-152)"
note = "the Frankenstein 6.037 client (gcr), its own column; 6.037 is the retail 2D-only 6.03r7"
