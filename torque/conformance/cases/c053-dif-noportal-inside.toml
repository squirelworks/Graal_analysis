id = "C053"
slug = "dif-noportal-inside"
title = "Zone culling from inside: the same view with the A-B doorway still splitting the zones but no portal written; a zone renderer cannot reach room B"
rows = ["T3D-030", "T3D-087"]
priority = 2

[world]
lines = """
sun 0.57735 0.57735 -0.57735 0.8 0.8 0.8 1 0.3 0.3 0.35 1
sky conf_sky0,conf_sky1,conf_sky2,conf_sky3,conf_sky4,conf_sky5 500
skyoptions 1 0 0 0.4 0.6 0.9
object ConfHouse conf_dif_noportal.dif 0 12 0
playershape conf_nomat.3ds
spawn 0 0 1
"""
files = ["conf_nomat.3ds", "conf_sky*", "conf_dif_out.png", "conf_dif_floor.png", "conf_dif_a.png", "conf_dif_b.png", "conf_dif_noportal.dif"]
scripts = ["probe_difcam_inside.gs2"]

[run]
seconds = 60

[[check]]
id = "compiled"
kind = "server"
pattern = "weapon3d ConfProbe: not compiled"

[[check]]
id = "asks_dif"
kind = "server"
pattern = "file conf_dif_noportal\\.dif: "

[[check]]
id = "asks_tex"
kind = "server"
pattern = "file conf_dif_a"
note = "a texture of the interior is asked for (with or without extension)"

[[check]]
id = "refused"
kind = "console"
pattern = "incompatible file version|Unable to read detail level"

[[check]]
id = "lit"
kind = "console"
pattern = "lit in [0-9.]+ seconds|[Ll]ightmap"
note = "the interior lighting line ('Room lit in ... seconds' on an MBG file)"

[[check]]
id = "cam"
kind = "probe"
key = "cam"
value = "1"
note = "the probe holds ServerConnection.camera at its pose"

[[check]]
id = "room_b_seen"
kind = "pixel"
colour = [0, 128, 128]
tol = 80
min_fraction = 0.002
note = "room B's teal through the doorway: drawn means the inside view ignores zones or portals"

[[check]]
id = "differs_from_portal"
kind = "diff"
against = "C052"
region = [0.35, 0.3, 0.65, 0.9]
tol = 40
min_fraction = 0.05
note = "the doorway part of the view differs from C052 (the same view with portal 1)"

[[check]]
id = "alive"
kind = "alive"

[expect."5.12"]
compiled = false
asks_dif = true
asks_tex = "?"
refused = false
lit = "?"
cam = true
room_b_seen = "?"
differs_from_portal = "?"
alive = true
source = "[gen] tools/dif/difgen.py; first live run (this PR)"
