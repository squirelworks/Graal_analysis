id = "C001"
slug = "link-3prefix"
title = "A \"3 \" server: TCP login, UDP link on port + 1, mission start, control object"
rows = ["T3D-059", "T3D-028", "T3D-022", "T3D-025"]
priority = 1

[world]
lines = """
sun 0.57735 0.57735 -0.57735 0.8 0.8 0.8 1 0.3 0.3 0.35 1
sky conf_sky0,conf_sky1,conf_sky2,conf_sky3,conf_sky4,conf_sky5 500
skyoptions 1 0 0 0.4 0.6 0.9
playershape conf_nomat.3ds
spawn 0 0 1
"""
files = ["conf_nomat.3ds", "conf_sky*"]

[run]
seconds = 75

[[check]]
id = "tcp_login"
kind = "server"
pattern = "logged in as player"

[[check]]
id = "udp_link"
kind = "trace"
pattern = "linked from"
note = "the client opened the Torque UDP link (always listed port + 1, T3D-028)"

[[check]]
id = "protocol19"
kind = "trace"
pattern = "\\t19\\t.*linked from"

[[check]]
id = "protocol24"
kind = "trace"
pattern = "\\t24\\t.*linked from"

[[check]]
id = "control"
kind = "server"
pattern = "control object delivered"
note = "the client acked the packet that named its control object (login step 5)"

[[check]]
id = "activated"
kind = "console"
pattern = "Graal(3D)? has been activated"

[[check]]
id = "alive"
kind = "alive"

[expect."3.153"]
tcp_login = true
udp_link = true
protocol19 = true
protocol24 = false
control = true
activated = "?"
alive = true
source = "[lab] torque/live-3153-and-404r2-sessions-2026-11-25.md (protocol 19, three phases, stock Player control, link held about 3 min); seihai-gserver docs/GRAAL3D.md lab 2026-11-26 (the 3.153 row, Camera control, sky drawn)"

[expect."4.04r2"]
tcp_login = true
udp_link = true
protocol19 = true
protocol24 = false
control = true
activated = true
alive = true
source = "[lab] seihai-gserver docs/GRAAL3D.md lab 2026-11-19 (\"Initial Control Object\", \"Graal3D has been activated!\", link held 96 s); T3D-025"
note = "under Wine in the Linux lab VM; the Windows 10 VM crashes this build at start"

[expect."4.20r8"]
tcp_login = true
udp_link = true
protocol19 = false
protocol24 = true
control = true
activated = "?"
alive = true
source = "[lab] T3D-059 (4.20r8 links as protocol 24, Win10); seihai-gserver docs/GRAAL3D.md lab 2026-11-26 (control object delivered, link held about 90 s)"

[expect."5.12"]
tcp_login = true
udp_link = true
protocol19 = false
protocol24 = true
control = true
activated = "?"
alive = true
source = "[lab] T3D-022, T3D-059; seihai-gserver docs/GRAAL3D.md lab 2026-11-20 (Windows 10 VM, control object delivered in seq 3)"

[expect."6.037"]
tcp_login = "?"
udp_link = false
protocol19 = false
protocol24 = false
control = false
activated = false
alive = "?"
source = "[bin] T3D-121, T3D-132: the 6.03r7 client is the Quattro 2D engine with no Torque UDP side, so it never links; whether the packed retail build logs in to our gen-5 server at all is open"

[expect."6.037F"]
tcp_login = "?"
udp_link = "?"
protocol19 = "?"
protocol24 = "?"
control = "?"
activated = "?"
alive = "?"
source = "unread: first live run of our Frankenstein build (T3D-152)"
note = "the Frankenstein 6.037 client (gcr), its own column; 6.037 is the retail 2D-only 6.03r7"
