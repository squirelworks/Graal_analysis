id = "C059"
slug = "sweep-sky-sun-water"
title = "Every typed GS2 3D member of Sky, Sun, fxSunLight and WaterBlock, touched on a live client (full sweep)"
rows = ["T3D-150", "T3D-096"]
priority = 3

# Generated by tools/conformance/gen_sweep.py; do not edit by hand.
# Per-member values go to torque/conformance/sweep/results.tsv (gen_sweep.py extract).

[world]
lines = """
sun 0.57735 0.57735 -0.57735 0.8 0.8 0.8 1 0.3 0.3 0.35 1
sky conf_sky0,conf_sky1,conf_sky2,conf_sky3,conf_sky4,conf_sky5 500
skyoptions 1 0 0 0.4 0.6 0.9
object ConfCube conf_red.3ds 0 4 1
playershape conf_nomat.3ds
spawn 0 0 1
"""
files = ["conf_red.3ds", "conf_nomat.3ds", "conf_sky*"]
scripts = ["sweep_sky_sun_water.gs2"]

[run]
seconds = 45

[[check]]
id = "compiled"
kind = "server"
pattern = "weapon3d ConfProbe: not compiled"

[[check]]
id = "made"
kind = "probe"
key = "made"
value = "1"

[[check]]
id = "done"
kind = "probe"
key = "done"
value = "1"
note = "every class step ran (no script stop, no crash)"

[[check]]
id = "alive"
kind = "alive"
note = "the client was still running at the end"

[expect."4.20r8"]
compiled = false
made = "?"
done = "?"
alive = "?"
source = "unread: the typed table is read for 5.12; a 4.20r8 member may be absent"

[expect."5.12"]
compiled = false
made = "?"
done = "?"
alive = "?"
source = "[bin] T3D-096 types every member called here; values unread before this sweep"

[expect."6.037F"]
compiled = false
made = "?"
done = "?"
alive = "?"
source = "unread: our Frankenstein 6.037 (gcr) against the 5.12 surface"
