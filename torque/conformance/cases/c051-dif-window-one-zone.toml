id = "C051"
slug = "dif-window-one-zone"
title = "Baseline for C050: the same windowed house with every surface in the outside zone and no portals"
rows = ["T3D-030", "T3D-087"]
priority = 1

[world]
lines = """
sun 0.57735 0.57735 -0.57735 0.8 0.8 0.8 1 0.3 0.3 0.35 1
sky conf_sky0,conf_sky1,conf_sky2,conf_sky3,conf_sky4,conf_sky5 500
skyoptions 1 0 0 0.4 0.6 0.9
object ConfHouse conf_dif_window1.dif 0 12 0
playershape conf_nomat.3ds
spawn 0 0 1
"""
files = ["conf_nomat.3ds", "conf_sky*", "conf_dif_out.png", "conf_dif_floor.png", "conf_dif_a.png", "conf_dif_b.png", "conf_dif_window1.dif"]
scripts = ["probe_difcam_front.gs2"]

[run]
seconds = 60

[[check]]
id = "compiled"
kind = "server"
pattern = "weapon3d ConfProbe: not compiled"

[[check]]
id = "asks_dif"
kind = "server"
pattern = "file conf_dif_window1\\.dif: "

[[check]]
id = "asks_tex"
kind = "server"
pattern = "file conf_dif_a"
note = "a texture of the interior is asked for (with or without extension)"

[[check]]
id = "refused"
kind = "console"
pattern = "incompatible file version|Unable to read detail level"

[[check]]
id = "lit"
kind = "console"
pattern = "lit in [0-9.]+ seconds|[Ll]ightmap"
note = "the interior lighting line ('Room lit in ... seconds' on an MBG file)"

[[check]]
id = "cam"
kind = "probe"
key = "cam"
value = "1"
note = "the probe holds ServerConnection.camera at its pose"

[[check]]
id = "room_a_seen"
kind = "pixel"
colour = [255, 0, 128]
tol = 80
min_fraction = 0.002
note = "room A's hot pink seen through the missing front wall (every renderer should draw it)"

[[check]]
id = "alive"
kind = "alive"

[expect."5.12"]
compiled = false
asks_dif = true
asks_tex = "?"
refused = false
lit = "?"
cam = true
room_a_seen = "?"
alive = true
source = "[gen] tools/dif/difgen.py; first live run (this PR)"
