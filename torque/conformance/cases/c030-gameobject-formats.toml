id = "C030"
slug = "gameobject-formats"
title = "Defaults and value formats of the core GameObject and SceneObject members, on a client-made object and the player's own"
rows = ["T3D-096", "T3D-150", "T3D-125", "T3D-136"]
priority = 1

[world]
lines = """
sun 0.57735 0.57735 -0.57735 0.8 0.8 0.8 1 0.3 0.3 0.35 1
sky conf_sky0,conf_sky1,conf_sky2,conf_sky3,conf_sky4,conf_sky5 500
skyoptions 1 0 0 0.4 0.6 0.9
playershape conf_nomat.3ds
spawn 0 0 1
"""
files = ["conf_red.3ds", "conf_nomat.3ds", "conf_sky*"]
scripts = ["probe_gameobject.gs2"]

[run]
seconds = 50

# A recording case: most checks take any reported value, so the verdict says
# only whether the member answered. The values themselves are in results.tsv
# ("observed") and are what graal-client-repro copies. "made" and "done" judge.

