# Per-version client profiles: Graal 3.04 (Linux) and 3.153 (Mac OS X)
#
# Machine-readable companion to version-profiles/3.04-3.153.md and protocol/v3x-clients.md.
# Each value carries a confidence in the matching `*_src` key or in `notes`:
#   bin  = read from that client's executable (3.04 Linux i386 ELF after UPX unpack, 3.153 Mac PPC Mach-O)
#   file = read from shipped data files (license/, compiled TorqueScript .dso, prefs)
#   inf  = inferred
#   cap  = seen in the 2026-10-30 lab run of the real 3.04 client on GServer-v2 (lab-304-linux-2026-10-30.md)
# 3.153 was not run; its values are bin only.
# Field names follow 2.22-2.31.toml. The 3.x tokens carry the same date stamps as 2.22 (GNW03014)
# and 2.31 (GNW28015), so 3.04 is the 3.x twin of 2.22 and 3.153 the twin of 2.31.

schema = 1

[defaults.g3d]
client_type = 5
generation = 5
login_key_byte = true                  # GCHAR rand & 0x7F after the type byte
login_layout = "GCHAR type, GCHAR key, token[8], GSTR account, GSTR password"
login_frame = "u16be len + zlib, no compression byte, no XOR"
frame = "u16be(len + 1) + ctype + body"
ctype_by_size = { raw_below = 0x30, zlib_below = 0x1000, bz2_from = 0x1000 }
xor_limit_dwords = { raw = 12, zlib = 4, bz2 = 4 }   # same rule as gen 5 on Windows
lcg = { seed = 0x04A80B38, mul = 0x08088405, add = "key" }
cipher_src = "bin"
account_plain = true                   # no dec(b) = (~b - 10) step on account or password
listserver = { host = "listserver.graal.in", port = 14922, kind = "supported", port_status = "assumed", first_message_id = 7, token = "G3D30123", list_name = "newmain", config = "license/license.graal (RSA-1024 signed, e=17, PKCS#1 v1.5 SHA-1)", built_in_host = "listserver.graalonline.com", built_in_port = 14922 }
listserver_src = "bin file cap"        # cap: lab listserver only; never tested against the public listserver with a G3D token
listserver_login_frame = "one plain zlib frame with id 7 and id 1; the server replies in gen 5"   # cap (3.04)
serverlist_prefixes = { "P " = "Graal Gold", "3 " = "Graal 3D", "H " = "Hosted", "U " = "not listed", "" = "Classic" }
file_modtime = true
large_files = true                     # LARGEFILESTART/END (68/69), LARGEFILESIZE (84)
login_after = [37]                     # PLI_LANGUAGE only; no PLI_TAMPERCHECK (39) in either build
tampercheck = false
tampercheck_src = "bin cap"            # cap: 3.04, none in a 5-minute session
periodic_sends = { udp_15 = "about every 5.1 s to each peer, 1 byte, value 9 (2.31 sends this as TCP 24)" }   # cap (3.04); nothing periodic over TCP
login_frame_messages = [5, 37, 34, 34] # cap (3.04): login, language, UPDATEFILE bigmap.txt and minimap.txt in the one plain frame
login_props = "37 LANGUAGE; then UDP init unless noudp; then 23 WANTFILE / 34 UPDATEFILE for the player's own images, at most 5 queued"
login_props_src = "bin cap"
first_props_sent = [0, 18, 31, 33, 52, 75, 76]   # cap (3.04): nick, status, udpport, additflags, language, ostype, textcodepage
level_formats = ["GR-V1.00", "GR-V1.01", "GR-V1.02", "GR-V1.03", "GR-V1.04", "GLEVNW01", "GSERVL01", "GRMAP001", "GWEBL001"]
level_formats_src = "bin"              # GSERVL01 is the only 3.x-only magic; GWEBL001 is the DES-encrypted level cache
udp = { present = true, config_key = "$pref::Graal::noudp", fixed_port_key = "$pref::Graal::fixedudpport", codec = "2.05 P2P: seq + GCHAR id, XOR recipientId^1", ids_seen = [0, 15, 22, 26] }
udp_src = "bin cap"                     # cap: 3.04 two-player run
engine = "Torque Game Engine (C++), TorqueScript .dso version 33"

