# Per-version client profiles: Graal 5.00r7 to 6.03r7 (Windows)
#
# Machine-readable companion to protocol/v5x-clients.md, protocol/v6x-clients.md,
# protocol/v5v6-windows-unpacked.md, protocol/v5v6-lab-play.md and
# version-profiles/lab-v5-2026-10-30.md. Nothing here is new; every value is in one of those pages.
# Confidence in the matching `*_src` key:
#   bin  = read from the client binary (5.00r7 unpacked; the others from memory dumps after
#          MoleBox or Themida ran under Wine)
#   cap  = seen on the wire in the 2026-10-29/30 lab runs
#   inf  = inferred
# Field names follow 3.04-3.153.toml where they mean the same thing.

schema = 1

[defaults.lobby]
client_type = 5
generation = 5
cipher_src = "bin cap"
login_frame = "u16be len + zlib, no compression byte, no XOR"
login_layout = "GCHAR type, GCHAR key, token[8], GSTR account, GSTR password, then an unprefixed comma list: win, md5(product id), md5(adapter MAC), md5(C: volume serial)[, quoted Windows version from 5.12 on]"
login_src = "bin cap"
login_after = [37]                     # PLI_LANGUAGE in its own gen-5 frame, then file requests (23/34/47)
tampercheck = false
listserver = "none"                    # no listserver protocol: a game server named Login serves the list as scripted GUI (S>C 190)
first_server = "Login"                 # the built-in login host and its two fallbacks (see protocol/v5x-clients.md)
login_mode = "while the server name starts with 'login' (any case) no characters and no HUD are drawn; S>C 178 x,name,host,port moves the client to the server it names"
login_mode_src = "bin cap"
serverwarp_fields = "split on commas only: an unquoted x,<name with a space>,<lab address>,<port> reached the lab address and kept the whole name"
serverwarp_src = "cap"
guest_login = true                     # cap: every Windows build logs in as guest with a built-in password (see private notes)

[[version]]
label = "5.00r7"
token = "G3D22067"
token_src = "bin cap"
plo_known = "0-25, 27-43, 45-49, 67-69, 74, 75, 82, 84, 101, 102, 104-107, 131-134, 140, 150, 151, 153-156, 165, 166, 168-176, 178-187, 189-191, 193-195, 197"
plo_known_count = 100
plo_known_src = "bin"
# The send wrappers' constant ids, plus 11 and 38 seen on the wire. Ids sent through a variable
# were not captured, so this is a floor.
pli_sent = "1, 2, 4-19, 21-24, 26, 28, 29, 32-38, 41, 44, 47, 50, 79-81, 92, 93, 96-98, 130, 152, 154-159, 161"
pli_sent_src = "bin cap"
pli_sent_complete = false
login_fields = 4                       # cap: win,<md5>,"",<md5> under Wine
chat = "white bold sans serif, blue shadow, no bubble"

