# Per-version client profiles: Graal 4.04r2 (Windows), 4.20r6 (Mac OS X) and 4.20r8 (Windows)
#
# Machine-readable companion to protocol/v4x-clients.md and
# client-internals/live-behaviour-404.md. Nothing here is new; every value is in one of those pages.
# Confidence in the matching `*_src` key:
#   bin  = read from the client binary (4.04r2: the stock engine DLL unpacked from the Thinstall
#          installer; 4.20r8: a third-party packet-logger copy of the engine DLL; 4.20r6: the
#          PowerPC Mac binary)
#   cap  = seen on the wire in the 2026-10-30 lab run of the real 4.04r2 under Wine
#   inf  = inferred
# Field names follow 5.00-6.03.toml where they mean the same thing.

schema = 1

[defaults.lobby]
client_type = 5
generation = 5
cipher_src = "bin"
login_frame = "u16be len + zlib, no compression byte, no XOR (fixed mode 3, then dynamic)"
login_layout = "GCHAR type, GCHAR key, token[8], GSTR account, GSTR password, then an unprefixed comma list: platform and three machine fields"
login_src = "bin cap"
login_after = [37]                     # PLI_LANGUAGE, then file requests (basepackage.gupd, bigmap.txt seen on 4.04r2)
tampercheck = false
listserver = "none"                    # no listserver protocol: a game server named Login serves the list (S>C 190)
first_server = "Login"                 # license/license.graal: loginserver.graalonline.com:14900, then loginserver2 and loginserver3
login_mode = "while the lowercase server name starts with 'login' the draw-layer mask is 0 (no players, no HUD); S>C 178 x,name,host,port moves the client to the server it names"
login_mode_src = "bin cap"
chat = "white bold sans, pure blue shadow 1 px down and right, no bubble"   # cap (4.04r2)

[[version]]
label = "4.04r2"
token = "G3D17026"                     # date stamp 17 February 2006; GServer-v2 reports it as 4.042
token_src = "bin cap"
plo_known = "0-25, 27-43, 45-49, 67-69, 74, 75, 82, 84, 100-102, 104-106, 131-134, 150, 151, 153-156, 165, 166, 168-176, 178-187, 189-191, 193-195"
plo_known_count = 98
plo_known_src = "bin"
# Not read separately: 4.20r8's provisional set without 162 (the answer to 108, which 4.04r2
# does not handle). 1, 2, 11, 23, 34, 37, 38, 44 and 157 were seen in the lab.
pli_sent = "1, 2, 4-10, 12-19, 21-24, 26, 28, 29, 32, 33, 35-37, 41, 44, 50, 79-81, 92, 96, 130, 152, 154, 157, 158, 161"
pli_sent_src = "inf cap"
pli_sent_complete = false
login_platform = "win"
login_fields = 4                       # bin: win, md5(DigitalProductId), md5(MAC), md5(C: serial)
torque_protocol = 19                   # Graal3DEngine.dll; not part of the flat profile

[[version]]
label = "4.20r6"
platform = "mac"
token = "G3D27076"                     # date stamp 27 July 2006
token_src = "bin"
# 4.20r8's set without 41 and 196: a 97-case switch (0-195 without 41) plus 100 and 108 taken before it (re-read 2026-10-31).
plo_known = "0-25, 27-40, 42, 43, 45-49, 67-69, 74, 75, 82, 84, 100-102, 104-108, 131-134, 150, 151, 153-156, 165, 166, 168-176, 178-187, 189-191, 193-195"
plo_known_count = 99
plo_known_src = "bin"
pli_sent = "1, 2, 4-10, 12-19, 21-24, 26, 28, 29, 32-37, 41, 44, 46, 50, 79-81, 92, 96, 130, 152, 154, 157, 158, 161, 162"
pli_sent_src = "inf cap"               # 4.20r8's plus 34 and 46; 162 bin; 2, 23, 24, 34, 37, 44, 46, 157 cap (lab-mac-tiger-2026-10-31.md)
pli_sent_complete = false
login_platform = "mac"
login_fields = 4                       # bin cap: mac, hash(Ethernet MAC), hash(stat /etc), empty
login_fields_cap = 'mac,"",a87b712247c6c9068448ba8c2f68a24b,""'   # qemu guest: MAC field empty (sungem NIC), /etc hash 32 hex, 4th empty
torque_protocol = 21
live_run = "lab-mac-tiger-2026-10-31.md"   # Mac OS X 10.4 in qemu-system-ppc, software GL via an AGL shim

[[version]]
label = "4.20r8"
token = "G3D20126"                     # date stamp 20 December 2006
token_src = "bin"
plo_known = "0-25, 27-43, 45-49, 67-69, 74, 75, 82, 84, 100-102, 104-108, 131-134, 150, 151, 153-156, 165, 166, 168-176, 178-187, 189-191, 193-196"
plo_known_count = 101
plo_known_src = "bin"
# The connection code's send ids; some sends pass the id in a register, so this is a floor.
pli_sent = "1, 2, 4-10, 12-19, 21-24, 26, 28, 29, 32, 33, 35-37, 41, 44, 50, 79-81, 92, 96, 130, 152, 154, 157, 158, 161, 162"
pli_sent_src = "bin"
pli_sent_complete = false
login_platform = "win"
login_fields = 4
modified = "third-party packet-logger build: signature check patched out, zlib inflate hook; the stock DLL is in a password-protected archive"
