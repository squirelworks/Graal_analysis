[[build]]
label = "4.20r8"
platform = "win32"
base = "4.20r6"
protocol = 24
terrain_chunks = false
drawn = "world"
why = "Values are 4.20r6's except where read. The Windows 4.2.0.8 Graal3DEngine.dll (torque/4208-g3d.md) shows the GameObject layer with no ShapeBase or Player, no TorqueScript compiler and no .dso, two mission phases, and the terrain chunk send and event. A lab run (Graal_analysis PR #854, terrain-512 lab table) found it links as protocol 24 and plays normally, and that it takes the 5.12 TerrainBlock and TerrainChunkEvent layout and fills the levels3d/heights cache byte for byte like 5.12, but then crashes on a null call. Later runs (k8 to k10, 2026-11-25) narrowed it: with only a TerrainBlock it crashes whenever the camera starts near the terrain (about 60 units up) and never with the camera 200 up, with or without objects, so the fault is in the near-range terrain draw. The lab VM has only Windows' GDI Generic OpenGL 1.1, so an unchecked GL extension call is the likely cause, and it may work on Mesa or a real GPU. Until that is tested, a server must not offer it streamed terrain: terrain_chunks is false, as a crash under GDI GL only, untested elsewhere. Its class set and file rules were not read (T3D-002), so those stay assumed."
[build.evidence]
