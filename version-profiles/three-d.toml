# Per-build 3D (Torque) capabilities: Graal 3.04 to 5.12
#
# Machine-readable source for the `three_d` part of Seihai's version profile
# (seihai-core `VersionProfile::three_d`, mirrored by seihai tools/gen_three_d_fixture.py).
# The prose and the reasons are in version-profiles/three-d.md. Only builds with a Torque 3D side
# are listed. 1.x/2.x (Delphi) and 5.24r4 onwards have none; Graal3D 2000 (DirectX) is a separate
# program and out of scope.
#
# Every field has an evidence tag in the build's `evidence` table, one word per field:
#   bin      read statically from that build's binary
#   lab      seen with the real client against our gserver in a lab VM
#   cap      seen in a capture of the real client (normal play)
#   assumed  not read for this build; carried from the nearest read build or from stock TGE 1.x.
#            Seihai must treat it as a default, not a fact. Board row in `why` where one exists.
# A field tagged with several words ("bin cap") is backed by each.
#
# Sources: torque/wire-by-build.md, torque/script-and-terrain-tools-by-build.md,
# torque/terrain-512.md, torque/404r2-resource-filter.md, torque/live-512-third-party-session-2026-11-24.md,
# torque/engine-and-formats.md, torque/engine-304.md, torque/5007-g3d.md, graal3d/torque-engine-4x.md,
# torque/udp-session.md, torque/3d-capability-board.tsv, torque/live-3153-and-404r2-sessions-2026-11-25.md,
# torque/multi-client-3d-lab-2026-11-25.md, torque/3d-engine-static-reads-2026-11-25.md.
#
# Field meanings (values are closed sets so a generator can check them):
#   protocol            Torque protocol number, sent twice in the connect request; the accept must match
#   game                game string in the connect request
#   class_table         class types in the accept's class table: 0 none (stock), 3 object/datablock/event, 2 object/event
#   class_ids_12bit     class ids are a fixed 12 bits in the server's numbering
#   length_prefixes     every event and ghost update carries an int14 bit length
#   game_layer          "tge" (datablocks, Player, moves) or "gameobject" (Graal's GameObject model)
#   mission_phases      mission phases the client walks: 3 (TGE) or 2 (GameObject era)
#   phases_optional     the client still builds the world when the server sends no mission phases
#   client_moves        true: the client sends Torque Move structures; false: it reports its own position
#   control_objects     classes the client accepts as its control object
#   ter_file            loads a local .ter terrain file (levels3d/terrain/)
#   ter_max             highest .ter version read (0 = no .ter reader)
#   terrain_chunks      takes streamed terrain (TerrainChunkEvent / TerrainRequestUpdatesEvent)
#   chunk_cache         "heights" = levels3d/heights/<server, %NNN-escaped>/heights<x>-<y>.dat + heights.info
#                       (one texture name per line); "none"
#   terrain_texture     required terrain texture format ("256x256x24") or "" when not read
#   water               WaterBlock is a networked class
#   torque_script       "compiles" (TorqueScript compiler, exec) or "none"
#   server_scripts      a server can make the client run new TorqueScript (send .cs/.dso, or script text)
#   terraformer         "full" (stock generator), "greyscale" (loadGreyscale/saveGreyscale/setTerrain only), "none"
#   greyscale_rgba32_only  loadGreyscale is only safe with a 32-bit RGBA PNG (24-bit RGB and 8-bit grey crash it)
#   terrain_editor      Torque's TerrainEditor is present
#   dts_min             lowest DTS shape version read (low byte of the version word; 0 = no floor)
#   dts_max             highest DTS shape version read
#   dif_version         DIF interior resource version accepted (0 = none)
#   three_ds            reads .3ds shapes
#   md3_version         Quake 3 .md3 version read (0 = none)
#   texture_names       "strip_png": the client strips .png from a material texture name and requests and
#                       stores the bare name; "as_named": requested with the name it was given
#   download_refused    extensions the resource-miss path will not ask the gserver for
#   bigdata             BigDataStartEvent/BigDataChunkEvent text channel present
#   bigdata_chunk_max   largest BigDataChunkEvent payload in bytes (int8 length)
#   terrain_chunk_max   largest TerrainChunkEvent zlib payload in bytes (int10 length; 0 = no chunks)
#   udp_port_offset     the Torque UDP port is the listed gserver port plus this
#   requires_sky        the client crashes unless a Sky is ghosted before the mission starts
#   sky_gif             the client asks for sky textures as .gif (never .png)
#   drawn               the most the client has been seen to draw on Seihai's gserver: "world" (terrain,
#                       shapes or GameObjects), "sky_only", or "nothing" (stays on the loading picture).
#                       A lab state, not a ceiling: it moves up when the gserver sends what the build needs
#   mirrors_2d_position the client's 3D movement also moves its 2D player on the gserver (TCP), so 2D
#                       clients in the level see it walk without server help
#   sees_2d_players     the client draws 2D players that share its level
#   takes_2d_chat       chat from 2D players in the level reaches the client (onRemotePlayerChats, over TCP)

